# Mosquitto config for CargoTwin
# Run from the repo root:  mosquitto -c mosquitto.conf -v
#
# Local development only: anonymous access, no TLS. Don't expose this to the internet.

# Plain MQTT for the ESP32 and app.py
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSocket for the browser dashboard (client/index.html -> ws://localhost:9001)
listener 9001
protocol websockets

allow_anonymous true
